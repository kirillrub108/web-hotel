services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: проверка по TCP. Через unix-сокет pg_isready отвечает «готово» ещё во время
      # первичной инициализации, когда временный сервер TCP не слушает.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@db:5432/${POSTGRES_DB:-hotel}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # uvicorn берёт IP клиента из X-Forwarded-For, который выставляет прокси во frontend.
      FORWARDED_ALLOW_IPS: "*"
    # Порядок важен: миграции создают схему, сид наполняет пустую базу, затем стартует приложение.
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --reload --host 0.0.0.0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE: http://backend:8000
      WATCH_POLLING: ${WATCH_POLLING:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
